<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Taro kortos, ritualai pagal Mėnulio fazes, numerologija, sapnininkas ir taro pamokos lietuviškai.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1424">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luna Arcana">
<title>Luna Arcana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a lunar almanac — masthead, hero split (title | live moon ephemeris), daily card strip,
   the reading table as the working centre, then photo, learn and shop sections on a quiet grid.
   Colour: cyanotype — Prussian-blue ink on cool paper by day, paper-silver on blue-black by night; one candle accent. */
:root{
  --paper:#eef1f4; --surface:#f8fafc; --ink:#13284a; --muted:#566781; --line:#c8d1dc;
  --cyan:#1f4e8c; --silver:#8796ad; --candle:#a86a12; --rev:#a4402c;
  --card:#11284d; --cardfg:#e6ecf5; --cardline:#9fb3d1;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:4px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0a1424; --surface:#101d33; --ink:#e2e8f1; --muted:#97a6bd; --line:#24365a;
  --cyan:#86aee6; --silver:#b6c2d6; --candle:#e3ac52; --rev:#e8907a;
  --card:#0c1d38; --cardfg:#e2e8f1; --cardline:#7f98c0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1424; --surface:#101d33; --ink:#e2e8f1; --muted:#97a6bd; --line:#24365a;
  --cyan:#86aee6; --silver:#b6c2d6; --candle:#e3ac52; --rev:#e8907a;
  --card:#0c1d38; --cardfg:#e2e8f1; --cardline:#7f98c0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h2{font-size:clamp(28px,3.6vw,40px);line-height:1.1;letter-spacing:-.01em}
h3{font-size:21px;line-height:1.2}
p{margin:0}
.kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.hero :focus-visible,.photoband :focus-visible{outline-color:var(--glow)}
[hidden]{display:none!important}
.inner,.face{display:block}

/* views: one section of the site at a time */
.view{display:none}
.view.on{display:block;animation:viewin .35s ease-out}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}
/* readable labels: sentence case serif instead of tracked capitals */
.kicker{font-family:var(--body)!important;font-style:italic;font-size:15px!important;letter-spacing:0!important;text-transform:none!important}
.soonline{font-style:italic;color:var(--candle)}
/* subpage photo header: short, so the tool starts near the top */
.view:not(#pradzia) .photoband{margin-top:0}
.view:not(#pradzia) .photoband .wrap{padding-block:clamp(56px,9vw,104px) 30px}
/* home choices */
.choices .wrap{padding-block:56px 40px;display:grid;gap:22px}
.choicegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.choice{display:grid;grid-template-rows:auto auto 1fr;gap:8px;padding:22px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink);min-height:170px;transition:border-color .2s,transform .2s}
.choice:hover{border-color:var(--cyan);transform:translateY(-2px)}
.choice svg{width:30px;height:30px;color:var(--cyan);fill:none;stroke:currentColor;stroke-width:1.4}
.choice h3{font-size:24px}
.choice p{color:var(--muted);font-size:15.5px}
.choice .now{align-self:end;font-size:14px;color:var(--candle)}
@media (prefers-reduced-motion:reduce){.choice{transition:none}.choice:hover{transform:none}}
/* sticky top menu with the current page marked */
.mast{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.topnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--candle)}
/* mobile: tab bar within thumb reach */
.tabbar{display:none}
@media (max-width:760px){
  .topnav{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:grid;justify-items:center;gap:2px;padding:4px 2px;text-decoration:none;color:var(--muted);font-size:11.5px;min-height:48px}
  .tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
  .tabbar a[aria-current="page"]{color:var(--cyan);font-weight:600}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .mast .wrap{padding-block:10px}
}
@media (max-width:520px){.daily .wrap{grid-template-columns:1fr!important;justify-items:start}.dailyart{width:160px;justify-self:center}
 .mast .wrap{gap:8px 12px}#sound span{display:none}.hero .wrap{padding-block:28px 28px}.choices .wrap{padding-block:32px 28px}.choice{min-height:0}}
/* masthead */
.mast{border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding-block:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand svg{width:26px;height:26px;color:var(--cyan)}
.brand span{font-family:var(--display);font-size:24px;letter-spacing:.02em}
.brand i{font-style:italic}
nav{display:flex;flex-wrap:wrap;gap:6px 22px}
nav a{text-decoration:none;font-size:15px;color:var(--muted);padding:4px 0;border-bottom:1px solid transparent}
nav a:hover{color:var(--ink);border-bottom-color:var(--line)}
#lang{font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}

/* hero */
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center;padding-block:56px 48px}
.hero h1{font-size:clamp(42px,6.4vw,78px);line-height:1.02;letter-spacing:-.02em;margin:14px 0 18px}
.hero h1 em{font-style:italic;color:var(--cyan)}
.hero .lede{font-size:19px;max-width:38ch;color:var(--muted)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:var(--r);border:1px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer;font-size:15.5px}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.ephem{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:22px;display:grid;gap:16px;min-width:0}
.ephem .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.moonbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
#moon{width:132px;height:132px;max-width:100%}
.phase{font-family:var(--display);font-size:28px;line-height:1.1}
.ephem .eph{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.ephem .eph li{border-bottom:1px dotted var(--line);padding-bottom:3px}
.advice{font-style:italic;color:var(--ink);border-top:1px solid var(--line);padding-top:14px}
.fine{font-size:12.5px;color:var(--muted)}

/* daily */
.daily{border-block:1px solid var(--line);background:var(--surface)}
.daily .wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:32px;align-items:center;padding-block:36px}
.daily h3{font-size:30px;margin:6px 0 8px}
.daily .dm{max-width:60ch}

/* sections */
section.block .wrap{padding-block:64px 24px;display:grid;gap:22px}
.head{display:grid;gap:8px;max-width:62ch}
.tool{display:grid;gap:14px}
.spreads{display:flex;flex-wrap:wrap;gap:8px}
.spreads button{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:15px}
.catpick select{font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.spreads.cats button{font-family:var(--body)!important;text-transform:none!important;letter-spacing:0!important;font-size:14.5px!important;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;color:var(--muted)}
.spreads.cats button[aria-pressed="true"]{background:transparent;color:var(--cyan);border-color:var(--cyan)}
@media (min-width:760px){.table.lay{grid-template-columns:repeat(var(--cols),minmax(0,118px));gap:12px 14px}.table.lay .slot{grid-column:var(--c);grid-row:var(--r)}}
.m .pd{font-size:14px;color:var(--muted);margin-top:2px}
.spreads button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row input[type=text]{flex:1 1 280px;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.tog{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.hint{font-size:14.5px;color:var(--muted)}

/* table */
.felt{border:1px solid var(--line);border-radius:var(--r);background:
  radial-gradient(ellipse at 50% 0%, color-mix(in srgb,var(--cyan) 9%,transparent), transparent 70%), var(--surface);
  padding:28px 20px;overflow:hidden}
.table{display:grid;gap:18px 14px;grid-template-columns:repeat(auto-fit,minmax(112px,150px));justify-content:center;align-items:start}
.slot{display:grid;gap:7px;justify-items:center;text-align:center;min-width:0}
.pos{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-height:2.6em;line-height:1.3}
.revtag{font-family:var(--mono);font-size:11.5px;color:var(--rev);min-height:1.3em;letter-spacing:.06em;text-transform:uppercase}
@media (min-width:760px){
  .table.celtic{grid-template-columns:repeat(4,130px);grid-template-areas:". p5 . p10" "p4 p1 p6 p9" ". p3 . p8" ". . . p7";gap:10px 22px}
  .table.celtic .s1{grid-area:p1}.table.celtic .s2{grid-area:p1;z-index:2;transform:translateY(22%) rotate(90deg) scale(.7);pointer-events:none}.table.celtic .s2 .card{pointer-events:auto}
  .table.celtic .s2 .pos,.table.celtic .s2 .revtag{visibility:hidden}
  .table.celtic .s3{grid-area:p3}.table.celtic .s4{grid-area:p4}.table.celtic .s5{grid-area:p5}.table.celtic .s6{grid-area:p6}
  .table.celtic .s7{grid-area:p7}.table.celtic .s8{grid-area:p8}.table.celtic .s9{grid-area:p9}.table.celtic .s10{grid-area:p10}
}

/* cards */
.card{width:100%;max-width:150px;aspect-ratio:7/12;perspective:900px;border:0;padding:0;background:none;cursor:pointer;display:block}
.card.static{cursor:default}
.inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.up .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--card);color:var(--cardfg);box-shadow:0 1px 0 rgba(0,0,0,.05),0 6px 18px -10px rgba(10,20,40,.55)}
.face svg{display:block;width:100%;height:100%}
.front{transform:rotateY(180deg)}
.front.rev svg{transform:rotate(180deg)}
.card:hover .inner{translate:0 -3px}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.card:hover .inner{translate:none}}

/* meanings */
.meanings{display:grid;gap:0}
.m{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.m .n{font-family:var(--display);font-size:26px;color:var(--cyan);line-height:1}
.m h3{font-size:20px}
.m h3 small{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.m .r{color:var(--rev);font-style:italic}
.m p{max-width:66ch;margin-top:4px}

/* premium panels */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:22px;display:grid;gap:14px;align-content:start;min-width:0}
.chip{justify-self:start;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--candle);border:1px solid currentColor;border-radius:999px;padding:2px 10px}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ai-out{display:grid;gap:8px;max-width:68ch}
.ai-out:empty{display:none}
.ai-out h4{font-family:var(--display);font-weight:400;font-size:21px;margin:12px 0 0;color:var(--cyan)}
.drop{display:flex;flex-wrap:wrap;align-items:center;gap:10px;flex:1 1 260px;min-width:0;border:1px dashed var(--silver);border-radius:var(--r);padding:14px;cursor:pointer;color:var(--muted);font-size:15px}
.drop.over{background:var(--paper)}
.drop input{max-width:100%;min-width:0;font-size:14px;color:var(--ink)}
select{font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink);max-width:100%}
#preview{max-height:300px;width:auto;border-radius:var(--r);border:1px solid var(--line);justify-self:start}
.recrow{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.recrow .pl{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.conf{font-family:var(--mono);font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.conf.low{border-color:var(--rev);color:var(--rev)}
@media (max-width:560px){.recrow{grid-template-columns:1fr auto auto}.recrow .pl{grid-column:1/-1}}

/* learn & shop */
.learn{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:0;border-top:1px solid var(--ink)}
.learn article{padding:20px 22px 22px 0;border-bottom:1px solid var(--line);display:grid;gap:8px;align-content:start}
.subtabs{overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs{flex-wrap:nowrap!important}.subtabs button{white-space:nowrap}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lcard{display:grid;gap:4px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.lcard .n{font-family:var(--display);font-style:italic;color:var(--cyan);font-size:22px;line-height:1}
.lcard strong{font-family:var(--display);font-weight:400;font-size:19px}
.lcard small{color:var(--muted)}
.ldraw{display:flex;flex-wrap:wrap;gap:12px}
.ldraw .lcard{min-width:150px;flex:1 1 150px;border-color:var(--candle)}
.search{width:100%;max-width:520px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font-size:16px}
.qopts{display:grid;gap:8px;max-width:640px}
.qopts button{text-align:left;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:16px}
.qopts button:hover{border-color:var(--cyan)}
.progress{height:4px;background:var(--line);border-radius:2px;max-width:640px}.progress i{display:block;height:100%;background:var(--candle);border-radius:2px}
.pairs{display:grid;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.pairs article{display:grid;gap:4px}
.pairs h4{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
.subtabs{display:flex;gap:4px 22px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:6px}
.subtabs button{all:unset;cursor:pointer;padding:10px 0;font-size:16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--candle)}
.subtabs button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.pane{display:none;gap:22px}.pane.on{display:grid}
.signgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.signgrid button{display:grid;gap:2px;justify-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font-size:15px}
.signgrid button .gl{font-size:24px;line-height:1;color:var(--cyan);font-family:"Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols",serif;font-variant-emoji:text}
.signgrid button small{color:var(--muted);font-size:12.5px}
.signgrid button[aria-pressed="true"]{border-color:var(--candle);box-shadow:0 0 0 1px var(--candle)}
.signgrid button.today small{color:var(--candle)}
.dict{display:grid;gap:0;border-top:1px solid var(--line)}
.dict details{border-bottom:1px solid var(--line);padding:12px 0}
.dict summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;list-style-position:outside}
.dict summary strong{font-family:var(--display);font-weight:400;font-size:21px}
.dict summary span{color:var(--muted);font-size:15px}
.dict .body{display:grid;gap:8px;padding:10px 0 4px;max-width:70ch}
.dict .tags span{font-family:var(--body);letter-spacing:0}
.learn button{all:unset;cursor:pointer;display:grid;gap:8px;align-content:start;padding:20px 22px 22px 0;border-bottom:1px solid var(--line)}
.learn button:hover h3,.learn button[aria-pressed="true"] h3{color:var(--cyan)}
.learn button:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
.learn .meta{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lesson,.ritdetail{margin-top:22px;padding:clamp(20px,4vw,40px);gap:18px}
.lesson h3,.ritdetail h3{font-size:clamp(26px,3.4vw,36px)}
.lesson h4,.ritdetail h4{font-family:var(--display);font-weight:400;font-size:22px;margin:10px 0 0}
.prose{display:grid;gap:12px;max-width:68ch}
.prose ul,.prose ol{margin:0;padding-left:1.2em;display:grid;gap:6px}
.keyp{border-left:2px solid var(--candle);padding:4px 0 4px 18px;display:grid;gap:6px;max-width:68ch}
.qz{display:grid;gap:18px;max-width:68ch}
.qz fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;margin:0;display:grid;gap:8px}
.qz legend{padding:0 6px;font-weight:600}
.qz label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15.5px}
.qz label.ok{color:var(--cyan);font-weight:600}.qz label.bad{color:var(--rev);text-decoration:line-through}
.qz .ex{font-size:14px;color:var(--muted)}
.lnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.cquiz{margin-top:22px;grid-template-columns:minmax(0,1fr);gap:12px}
.cquiz .opts{display:flex;flex-wrap:wrap;gap:8px}
.cquiz .opts button{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:15px}

/* card library */

.libgrid button .face{position:relative;width:72px;aspect-ratio:7/12;border-radius:6px}
.libgrid button[aria-pressed="true"] .face{outline:2px solid var(--candle);outline-offset:2px}

.det{display:grid;gap:10px;min-width:0}

.det .kws span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.det .kws.rev span{color:var(--rev);border-color:color-mix(in srgb,var(--rev) 40%,transparent)}
.det dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:14.5px}
.det dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.det dd{margin:0}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--cyan);font-size:14.5px}

/* ritual calendar */
.ritgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}

.score i{width:12px;height:12px;border-radius:50%;border:1px solid var(--silver)}
.score i.on{background:var(--candle);border-color:var(--candle);box-shadow:0 0 8px color-mix(in srgb,var(--candle) 60%,transparent)}
.best{list-style:none;margin:0;padding:0;display:grid;gap:0}
.best li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.best .dt{font-family:var(--display);font-size:20px}
.best .why{grid-column:1/-1;font-size:13.5px;color:var(--muted)}

.tags span{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted)}

/* numerology */
.numgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0;border-top:1px solid var(--ink)}

.bignum{font-family:var(--display);font-size:clamp(64px,8vw,96px);line-height:.9;color:var(--cyan);font-variant-numeric:lining-nums}
.ncard{width:84px}
.ncard .card{width:84px}

/* ===== mystical layer ===== */
/* the hero is always a night sky (deliberate single look), the rest of the page follows the theme */
:root{--night:#060d1c;--night2:#0d1d3b;--h-ink:#eaf0f8;--h-muted:#a8b6cc;--h-line:rgba(234,240,248,.16);--aurora1:#5fe0b0;--aurora2:#7a6cf0;--glow:#f2c46b}
.hero{position:relative;isolation:isolate;background:linear-gradient(180deg,var(--night) 0%,var(--night2) 100%);color:var(--h-ink);overflow:hidden}
.hero #sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
/* real aurora photo from Sørburøy behind the hero, darkened on the text side */
.hero .photo{position:absolute;inset:0;z-index:-2;background:url('img/hero.jpg') center 35%/cover no-repeat;animation:drift 60s ease-in-out infinite alternate}
.hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,13,28,.86) 0%,rgba(6,13,28,.55) 45%,rgba(6,13,28,.2) 100%),linear-gradient(180deg,rgba(6,13,28,.15),rgba(6,13,28,.6))}
@keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.12) translate(-2%,1%)}}
@media (max-width:860px){.hero .photo::after{background:linear-gradient(180deg,rgba(6,13,28,.55),rgba(6,13,28,.88) 60%)}}
@media (prefers-reduced-motion:reduce){.hero .photo{animation:none}}
/* full-bleed photo band */
.photoband{position:relative;isolation:isolate;color:var(--h-ink);overflow:hidden;margin-top:24px}
.photoband::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,13,28,.35),rgba(6,13,28,.8)),var(--photo) center var(--pos,40%)/cover no-repeat}
.photoband .wrap{padding-block:clamp(90px,16vw,170px) 48px;display:grid;gap:12px;max-width:1120px}
.photoband .kicker{color:var(--aurora1)}
.photoband h2{font-size:clamp(32px,4.6vw,54px);max-width:18ch}
.photoband p{max-width:62ch;color:var(--h-muted);font-size:17.5px}
/* brand story */
.story .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:72px 24px}
.mosaic{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mosaic figure{margin:0;border-radius:var(--r);overflow:hidden}
.mosaic .big{grid-column:1/-1}
.mosaic img{display:block;width:100%;height:100%;aspect-ratio:16/10;object-fit:cover}
.mosaic .big img{aspect-ratio:16/9}
.storytext{display:grid;gap:12px;max-width:52ch}
@media (max-width:760px){.story .wrap{grid-template-columns:1fr}}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:90px;z-index:-1;background:linear-gradient(180deg,transparent,rgba(6,13,28,.55))}
.hero .kicker{color:var(--aurora1)}
.hero h1 em{color:var(--glow)}
.hero .lede{color:var(--h-muted)}
.hero .btn{background:var(--h-ink);color:var(--night);border-color:var(--h-ink)}
.hero .btn.alt{background:transparent;color:var(--h-ink);border-color:var(--h-line)}
.hero .ephem{background:rgba(10,22,44,.55);border-color:var(--h-line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero .ephem .eph{color:var(--h-muted)}
.hero .ephem .eph li{border-bottom-color:var(--h-line)}
.hero .advice{color:var(--h-ink);border-top-color:var(--h-line)}
.hero .fine{color:var(--h-muted)}
.hero .kicker,.hero .mono{text-shadow:0 0 18px rgba(95,224,176,.25)}
.mast{position:relative;z-index:3}
#sound{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--muted);cursor:pointer}
#sound svg{width:16px;height:16px}
#sound[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* moon-phase strip used as a section divider */
.phasestrip{display:flex;justify-content:center;gap:clamp(10px,3vw,28px);padding-block:26px;opacity:.9}
.phasestrip svg{width:22px;height:22px}
.phasestrip .now{filter:drop-shadow(0 0 6px var(--glow))}

/* daily card on a slowly turning zodiac ring */
.dailyart{position:relative;display:grid;place-items:center;width:190px;aspect-ratio:1;justify-self:center}
.dailyart .ring{position:absolute;inset:0;color:var(--silver);animation:turn 180s linear infinite}
.dailyart .card{position:relative;width:104px}
@keyframes turn{to{transform:rotate(360deg)}}
.daily .wrap{grid-template-columns:190px minmax(0,1fr)}

/* candlelight that follows the pointer over the reading table */
.felt{position:relative;background:var(--surface)}
.felt::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,30%),color-mix(in srgb,var(--glow) 16%,transparent),transparent 65%);transition:opacity .4s}
.felt .table{position:relative}

/* foil shimmer on face-up cards */
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(242,196,107,.22) 48%,rgba(255,255,255,.18) 50%,transparent 62%);
  background-size:250% 100%;background-position:120% 0;transition:background-position .9s ease;pointer-events:none;mix-blend-mode:screen}
.card:hover .front::after,.card:focus-visible .front::after{background-position:-20% 0}
.card.up .front{box-shadow:0 0 0 1px rgba(242,196,107,.25),0 10px 28px -12px rgba(242,196,107,.45)}

/* shuffle + deal */
.shuffle{position:absolute;left:50%;top:50%;width:84px;aspect-ratio:7/12;translate:-50% -50%;z-index:5;pointer-events:none}
.shuffle .sc{position:absolute;inset:0;border-radius:7px;overflow:hidden;background:var(--card);box-shadow:0 6px 16px -8px rgba(0,0,0,.6)}
.shuffle .sc:nth-child(1){animation:riffleA .45s ease-in-out 2}
.shuffle .sc:nth-child(2){animation:riffleB .45s ease-in-out 2}
.shuffle .sc:nth-child(3){animation:riffleA .45s ease-in-out .1s 2 reverse}
@keyframes riffleA{50%{transform:translateX(-46px) rotate(-10deg)}}
@keyframes riffleB{50%{transform:translateX(46px) rotate(10deg)}}
.deal .slot{animation:deal .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{opacity:0;transform:translateY(-26px) scale(.92)}}
.card.up .inner{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){
  .dailyart .ring{animation:none}.shuffle{display:none}.deal .slot{animation:none}
  .front::after{transition:none}
}
</style>

function cardSVG(c){
  const i=c.id; let art;
  if(c.type==="major"){ art=`<g transform="translate(0 6)">${MAJ_ART[i]}</g>`; }
  else{
    const r=(i-22)%14, g=G[c.type];
    const n=r+1, sc=r===0?1.9:n<=3?.9:n<=6?.74:.64;
    if(r<10){ art=PIPS[n].map(([x,y])=>`<g transform="translate(${x} ${y+8}) scale(${sc})" stroke-width="${(1.7/sc).toFixed(2)}">${g}</g>`).join(""); }

  const top=c.type==="major"?c.num:(((c.id-22)%14)<10?String((c.id-22)%14+1).replace(/^1$/,"I"):"");
  return `<svg viewBox="0 0 100 172" aria-hidden="true">

async function loadLang(code){
  if(!cache[code]){const r=await fetch(`lang/${code}.json`);if(!r.ok)throw new Error(code);cache[code]=await r.json();}
  return cache[code];

async function setLang(code){

const SYN=29.530588853, REF=Date.UTC(2000,0,6,18,14)/864e5;
function moonSign(t=Date.now()){
  // low-precision lunar longitude (about 1\u20132\u00b0 accuracy), enough for the zodiac sign away from sign borders
  const d=t/864e5+2440587.5-2451545.0, rad=Math.PI/180;

  let lon=L+6.289*Math.sin(M*rad)+1.274*Math.sin((2*D-M)*rad)+0.214*Math.sin(2*M*rad)+0.658*Math.sin(2*D*rad)-0.186*Math.sin(357.53*rad+0.9856*d*rad)-0.114*Math.sin(2*F*rad);

/* night sky with northern lights behind the hero */
function startSky(){
  const cv=$("sky"),c=cv.getContext("2d");let W=0,H=0,stars=[],raf=0,visible=true;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);W=cv.width=Math.max(1,r.width*d);H=cv.height=Math.max(1,r.height*d);
    let s=5;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
    stars=Array.from({length:Math.round(W*H/5200)},()=>({x:rnd()*W,y:rnd()*H*.95,r:(rnd()**3)*1.6*d+.3*d,p:rnd()*6.28,v:.5+rnd()*1.5}));}
  function frame(t){
    c.clearRect(0,0,W,H);
    for(const st of stars){const a=.35+.45*Math.sin(st.p+t/1000*st.v);c.fillStyle=`rgba(234,240,248,${a.toFixed(3)})`;c.beginPath();c.arc(st.x,st.y,st.r,0,7);c.fill();}
    c.globalCompositeOperation="lighter";
    // the real photo carries the aurora; the canvas only adds a faint moving shimmer on top
    const bands=[[.22,"95,224,176",.06,0],[.30,"122,108,240",.04,1.7]];
    for(const [yb,col,alpha,ph] of bands){
      const g=c.createLinearGradient(0,H*(yb-.18),0,H*(yb+.28));g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(.45,`rgba(${col},${alpha})`);g.addColorStop(1,`rgba(${col},0)`);
      c.fillStyle=g;c.beginPath();c.moveTo(0,H);
      for(let x=0;x<=W;x+=W/48){const y=H*yb+Math.sin(x/W*6.2+t/5200+ph)*H*.07+Math.sin(x/W*13+t/3100+ph*2)*H*.03;c.lineTo(x,y);}
      c.lineTo(W,H);c.closePath();c.fill();}
    c.globalCompositeOperation="source-over";
    if(!reduce&&visible)raf=requestAnimationFrame(frame);
  }
  size();frame(0);
  addEventListener("resize",()=>{size();if(reduce)frame(0)});
  if(!reduce&&"IntersectionObserver"in window){new IntersectionObserver(e=>{visible=e[0].isIntersecting;cancelAnimationFrame(raf);if(visible)raf=requestAnimationFrame(frame)}).observe(cv)}
}

  const ex=Math.abs(kk)*r, sweepIn=(wax?(illum<.5?0:1):(illum<.5?1:0));
  const d=`${half}A${ex.toFixed(2)} ${r} 0 0 ${sweepIn} 12 ${12-r}z`;
  return `<svg viewBox="0 0 24 24" class="${now?"now":""}"><circle cx="12" cy="12" r="${r}" fill="none" stroke="var(--silver)" stroke-width=".9"/>${k===0?"":`<path d="${k===4?`M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z`:d}" fill="${now?"var(--glow)":"var(--silver)"}"/>`}</svg>`;
}

/* ambient sound: a soft drone made in the browser, started only by the visitor */
let audio=null;
function toggleSound(){
  const b=$("sound");
  if(audio){const a=audio;audio=null;try{a.out.gain.setTargetAtTime(0,a.ctx.currentTime,.4);setTimeout(()=>a.ctx.close(),1500)}catch(e){}b.setAttribute("aria-pressed","false");return}
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=new AC();ctx.resume&&ctx.resume();
    const out=ctx.createGain();out.gain.setValueAtTime(0,ctx.currentTime);out.gain.linearRampToValueAtTime(.32,ctx.currentTime+2.5);out.connect(ctx.destination);
    // warm pad: open fifths in A with a soft high shimmer, audible on small speakers
    const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=1800;f.Q.value=.7;f.connect(out);
    const fl=ctx.createOscillator();fl.frequency.value=.04;const fg=ctx.createGain();fg.gain.value=700;fl.connect(fg);fg.connect(f.frequency);fl.start();
    [[110,"sine",.30,0],[220,"triangle",.16,3],[329.6,"sine",.13,-4],[493.9,"sine",.07,5],[659.3,"sine",.035,-2]].forEach(([hz,type,vol,det],i)=>{
      const o=ctx.createOscillator();o.type=type;o.frequency.value=hz;o.detune.value=det;
      const g=ctx.createGain();g.gain.value=vol;
      const l=ctx.createOscillator();l.frequency.value=.07+i*.05;const lg=ctx.createGain();lg.gain.value=vol*.45;l.connect(lg);lg.connect(g.gain);
      o.connect(g);g.connect(f);o.start();l.start();});
    // soft wind: filtered noise that swells slowly
    const n=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const ns=ctx.createBufferSource();ns.buffer=n;ns.loop=true;const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=700;bp.Q.value=.6;
    const wg=ctx.createGain();wg.gain.value=.035;const wl=ctx.createOscillator();wl.frequency.value=.09;const wlg=ctx.createGain();wlg.gain.value=.03;wl.connect(wlg);wlg.connect(wg.gain);
    ns.connect(bp);bp.connect(wg);wg.connect(out);ns.start();wl.start();

// traditional timing correspondences: phase group, moon signs (0=Aries..11=Pisces), weekdays (0=Sunday)
const RIT_RULES={
  money:{phase:["wax"],signs:[1,5,9],days:[4,0]},
  love:{phase:["wax"],signs:[1,6,3],days:[5]},
  protect:{phase:["full","wane"],signs:[9,7,0],days:[6,2]},
  cleanse:{phase:["wane"],signs:[5,7,11],days:[6]},
  begin:{phase:["new","young"],signs:[0,4,8],days:[0,1]},
  intuition:{phase:["new","full"],signs:[3,7,11],days:[1]}
};
let currentIntent="money";
function phaseGroups(t){const f=moonNow(t).age/SYN,g=[];
  if(f<.035||f>.965)g.push("new");else if(Math.abs(f-.5)<.035)g.push("full");else if(f<.5){g.push("wax");if(f<.2)g.push("young")}else g.push("wane");
  return g}
function evalDay(t,key){
  const r=RIT_RULES[key],pg=phaseGroups(t),sign=moonSign(t),day=new Date(t).getDay(),m=moonNow(t);
  const okP=r.phase.some(p=>pg.includes(p)),okS=r.signs.includes(sign),okD=r.days.includes(day);
  return {t,score:(okP?2:0)+(okS?2:0)+(okD?1:0),okP,okS,okD,sign,day,idx:m.idx};
}
function scoreDots(n){return `<span class="score" aria-label="${esc(fill(T("ritScore"),{n}))}">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`}
function whyLine(e){const ph=T("moonPhases"),sg=T("signs"),pd=T("planetDays");
  return fill(T("ritWhy"),{phase:ph[e.idx],moon:fill(T("moonIn"),{sign:sg[e.sign]}),day:pd[e.day]})}
function tagsFor(e){return `<div class="tags"><span class="${e.okP?"ok":""}">${esc(T("ritMatchPhase"))}</span><span class="${e.okS?"ok":""}">${esc(T("ritMatchSign"))}</span><span class="${e.okD?"ok":""}">${esc(T("ritMatchDay"))}</span></div>`}
function renderRitual(){
  const ints=T("intents");if(!Array.isArray(ints))return;
  $("intents").innerHTML=ints.map(x=>`<button type="button" data-k="${x.key}" aria-pressed="${x.key===currentIntent}">${esc(x.name)}</button>`).join("");
  $("intents").querySelectorAll("button").forEach(b=>b.onclick=()=>{currentIntent=b.dataset.k;ritOpen=null;renderRitual()});
  const it=ints.find(x=>x.key===currentIntent)||ints[0];
  const base=new Date();base.setHours(12,0,0,0);
  const days=Array.from({length:31},(_,i)=>evalDay(base.getTime()+i*864e5,it.key));
  const today=days[0];
  let fmt;try{fmt=new Intl.DateTimeFormat(lang==="no"?"nb":lang,{weekday:"long",day:"numeric",month:"long"})}catch(e){fmt={format:d=>d.toDateString()}}
  $("ritToday").innerHTML=`<div class="kicker">${esc(T("ritToday"))} \u00b7 ${esc(fmt.format(new Date(today.t)))}</div>
    <div class="rt-big">${esc(it.name)}</div><p class="muted">${esc(it.text)}</p>${scoreDots(today.score)}<p class="hint">${esc(whyLine(today))}</p>${tagsFor(today)}`;
  const best=days.slice(1).filter(d=>d.score>=3).sort((a,b)=>b.score-a.score||a.t-b.t).slice(0,4);
  $("ritBest").innerHTML=(best.length?best:days.slice(1).sort((a,b)=>b.score-a.score||a.t-b.t).slice(0,3)).map(d=>
    `<li><span class="dt">${esc(fmt.format(new Date(d.t)))}</span>${scoreDots(d.score)}<span class="why">${esc(whyLine(d))}</span></li>`).join("");
  $("ritRule").innerHTML=`<strong>${esc(T("ritRules"))}:</strong> ${esc(it.rule)}`;
  renderRitList();
}

  const names=["rituals","learn","spreads","numerology","rituals-season","rituals-micro","rituals-sign","learn2","astrology","symbols","encyclopedia","lenormand","games","dreams-a","dreams-b","pairs-a","pairs-b"];

  if(!SLUGS)SLUGS=await loadJSON("lib/slugs.json");
  const [rit,learn,spreads,num,s1,s2,s3,learn2,astro,symbols,ency,lenormand,games,dA,dB,pA,pB]=got;
  const dreams=dA||dB?{intro:(dA||{}).intro||[],items:[...list((dA||{}).items),...list((dB||{}).items)]}:null;
  const pairs={};[...list((pA||{}).pairs),...list((pB||{}).pairs)].forEach(x=>{pairs[`${Math.min(x.a,x.b)}-${Math.max(x.a,x.b)}`]=x});const more=[s1,s2,s3];
  if(code!=="lt"&&(!rit||!learn||!spreads||!num))return contentCache[code]=await loadContent("lt");

}

const digitSum=n=>String(n).split("").reduce((a,b)=>a+(+b||0),0);

const LETTER_VAL=ch=>{const b=ch.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();const i="ABCDEFGHIJKLMNOPQRSTUVWXYZ".indexOf(b);return i<0?0:i%9+1};

function nameNums(name){const ls=[...name].filter(ch=>LETTER_VAL(ch));if(!ls.length)return null;
  const sum=f=>reduceNum(ls.filter(f).reduce((a,ch)=>a+LETTER_VAL(ch),0),true);
  return {exp:sum(()=>true),soul:sum(isVowel),pers:sum(ch=>!isVowel(ch))}}

  const c=DECK[bc];

  $("nCardT").textContent=`${c.num} \u00b7 ${c.name}`;$("nCardX").textContent=c.up;

  $("nDayK").textContent=T("numDay");$("nDay").textContent=pd;$("nDayX").textContent=(N.day||{})[pd]||"";
  const d=(N.numbers||{})[life], el=$("numDeep");el.hidden=!d;
  if(d)el.innerHTML=`<div class="kicker">${esc(T("numLifePath"))} ${life}</div><h3>${esc(d.title)}</h3><div class="kws">${list(d.keywords).map(k=>`<span>${esc(k)}</span>`).join("")}</div>
    <div class="prose">${list(d.essence).map(p=>`<p>${esc(p)}</p>`).join("")}</div>
    <div class="ritgrid"><div><h4>${esc(T("numStrengths"))}</h4><div class="prose"><ul>${list(d.strengths).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div><div><h4>${esc(T("numChallenges"))}</h4><div class="prose"><ul>${list(d.challenges).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></div>
    <dl class="ritdl"><dt>${esc(LIB?LIB.labels.love:"")}</dt><dd>${esc(d.love)}</dd><dt>${esc(LIB?LIB.labels.work:"")}</dt><dd>${esc(d.work)}</dd><dt>Taro</dt><dd>${esc(d.tarot)}</dd></dl>`;
}
function renderRep(){
  const N=CONTENT.num;if(!N||!N.repeating){$("repBtns").innerHTML="";return}
  $("repIntro").textContent=N.repeatingIntro||"";
  $("repBtns").innerHTML=Object.keys(N.repeating).map(k=>`<button type="button" data-k="${k}">${k}</button>`).join("");
  $("repBtns").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("repBtns").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));$("repOut").innerHTML=`<strong class="rt-big">${b.dataset.k}</strong> \u2013 ${esc(N.repeating[b.dataset.k])}`});
}
function parseDate(v){const m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m||+m[1]<1900||new Date(v)>new Date())return null;return [+m[1],+m[2],+m[3]]}
$("pairForm").addEventListener("submit",e=>{e.preventDefault();const N=CONTENT.num,a=parseDate($("pA").value),b=parseDate($("pB").value);
  if(!a||!b||!N){$("pairOut").innerHTML=`<p class="hint">${esc(T("numInvalid"))}</p>`;return}
  const x=reduceNum(lifePathOf(...a),false),y=reduceNum(lifePathOf(...b),false),k=`${Math.min(x,y)}-${Math.max(x,y)}`;
  $("pairOut").innerHTML=`<div class="rt-big">${x} + ${y}</div><p>${esc((N.pairs||{})[k]||"")}</p><p class="fine">${esc(T("numPairNote"))}</p>`;});
$("numForm").addEventListener("submit",e=>{
  e.preventDefault();
  const v=$("bdate").value, m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/), y=m?+m[1]:0;
  if(!m||y<1900||new Date(v)>new Date()){$("numMsg").textContent=T("numInvalid");return}
  $("numMsg").textContent="";lastBirth=[y,+m[2],+m[3]];lastName=$("bname").value.trim().slice(0,80);renderNum();
});

/* ================= boot ================= */
$("draw").onclick=()=>draw(false);
$("sound").onclick=toggleSound;
$("felt").addEventListener("pointermove",e=>{const r=e.currentTarget.getBoundingClientRect();e.currentTarget.style.setProperty("--mx",`${e.clientX-r.left}px`);e.currentTarget.style.setProperty("--my",`${e.clientY-r.top}px`)});
startSky();renderRing();
$("flipall").onclick=()=>{drawn.forEach(c=>c.open=true);render()};
$("rev").onchange=()=>draw(false);
$("q").oninput=()=>renderMeanings();
$("lang").innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join("");
$("lang").onchange=e=>setLang(e.target.value);
let start="lt";
// while the site is built in Lithuanian, open in Lithuanian unless the visitor picked a language
try{const s=localStorage.getItem("luna-lang2");if(s&&LANGS.some(l=>l[0]===s))start=s;}catch(e){}
setLang(start);
getSample().then(async s=>{
  if(!s){$("aiNote").hidden=false;$("aiBtn").disabled=true;$("recBtn").disabled=true;$("photo").disabled=true;return}
  const lim=await s.limits().catch(()=>null);imagesOK=!!(lim&&lim.images);if(!imagesOK)$("photo").disabled=true;

</script>

<div id="installHint" hidden role="status"></div>
<script>
/* installable app: service worker + install button */
(function(){
  if("serviceWorker" in navigator){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
  const tx=k=>{try{return T(k)}catch(e){return k}};
  let deferred=null;const btn=document.createElement("button");btn.id="install";btn.type="button";btn.hidden=true;
  btn.innerHTML='<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg><span></span>';
  const mast=document.querySelector(".mast .wrap");if(mast)mast.insertBefore(btn,document.getElementById("sound"));
  const label=()=>{btn.querySelector("span").textContent=tx("installApp")};
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;if(!standalone){label();btn.hidden=false}});
  btn.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice.catch(()=>null);deferred=null;btn.hidden=true}};
  addEventListener("appinstalled",()=>{btn.hidden=true});
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone;
  let seen=false;try{seen=localStorage.getItem("luna-ios-hint")==="1"}catch(e){}
  if(ios&&!seen){setTimeout(()=>{const h=document.getElementById("installHint");h.textContent=tx("installIos");h.hidden=false;
    h.onclick=()=>{h.hidden=true;try{localStorage.setItem("luna-ios-hint","1")}catch(e){}};setTimeout(()=>{h.hidden=true},12000)},4000)}
  document.addEventListener("click",()=>label(),{once:true});setTimeout(label,1500);
})();
</script>
